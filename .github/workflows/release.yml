name: Franchise Hub — publishing disabled until Step 16
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-blocked:
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed until independent release pipeline is implemented and validated
        run: |
          echo "::error::Publishing is disabled for the Franchise Hub development baseline. Complete Step 16 before enabling releases."
          exit 1
